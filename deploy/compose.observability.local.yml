services:
  jaeger:
    image: docker.m.daocloud.io/jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '127.0.0.1:16686:16686'
    networks: [observability]
  collector:
    image: docker.m.daocloud.io/otel/opentelemetry-collector-contrib:0.112.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - './otel-collector.local.yml:/etc/otelcol/config.yaml:ro'
    ports:
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:8888:8888'
    depends_on: [jaeger]
    networks: [observability]
networks:
  observability: {}

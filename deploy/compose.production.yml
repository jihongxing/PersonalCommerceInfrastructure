services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:17.6-bookworm}
    environment:
      POSTGRES_DB: personal_commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: personal_commerce
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personal_commerce -d personal_commerce']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - personal-commerce-postgres:/var/lib/postgresql/data

  migrate:
    image: ${API_IMAGE:-personal-commerce-api:current}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ['node', 'dist/scripts/database/migrate.js']
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ${API_IMAGE:-personal-commerce-api:current}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      APP_ENV: production
      RUNTIME_ENV: production
      REAL_MONEY_ENABLED: 'false'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPERATIONS_ACCESS_TOKEN: ${OPERATIONS_ACCESS_TOKEN:?OPERATIONS_ACCESS_TOKEN is required}
      OPERATIONS_OPERATOR_ID: ${OPERATIONS_OPERATOR_ID:?OPERATIONS_OPERATOR_ID is required}
      WEB_REFERENCE_CLIENT_ORIGIN: ${WEB_REFERENCE_CLIENT_ORIGIN:?WEB_REFERENCE_CLIENT_ORIGIN is required}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_BROWSER_TRACING_ENABLED: ${OTEL_BROWSER_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-pci-api}
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: ${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-http/json}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://127.0.0.1:4318/v1/traces}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      OTEL_BSP_MAX_QUEUE_SIZE: ${OTEL_BSP_MAX_QUEUE_SIZE:-2048}
      OTEL_BSP_EXPORT_TIMEOUT: ${OTEL_BSP_EXPORT_TIMEOUT:-5000}
      OTEL_SHUTDOWN_TIMEOUT_MS: ${OTEL_SHUTDOWN_TIMEOUT_MS:-6000}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/v1/readiness').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ${WEB_IMAGE:-personal-commerce-web-v2:current}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web-v2
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
        NEXT_PUBLIC_OTEL_BROWSER_TRACING_ENABLED: ${NEXT_PUBLIC_OTEL_BROWSER_TRACING_ENABLED:-false}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  personal-commerce-postgres:

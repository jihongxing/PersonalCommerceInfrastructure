services:
  postgres:
    image: docker.io/library/postgres:17.6-bookworm
    environment:
      POSTGRES_DB: personal_commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: personal_commerce
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personal_commerce -d personal_commerce']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - personal-commerce-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ['node', 'dist/scripts/database/migrate.js']
    environment:
      DATABASE_URL: postgresql://personal_commerce:${POSTGRES_PASSWORD}@postgres:5432/personal_commerce
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      APP_ENV: production
      CREATOR_ACTOR_MAPPINGS: ${CREATOR_ACTOR_MAPPINGS:?CREATOR_ACTOR_MAPPINGS is required}
      DATABASE_URL: postgresql://personal_commerce:${POSTGRES_PASSWORD}@postgres:5432/personal_commerce
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      WEB_REFERENCE_CLIENT_ORIGIN: ${WEB_REFERENCE_CLIENT_ORIGIN:-http://127.0.0.1:3001}
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/readiness').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:3000}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_healthy

volumes:
  personal-commerce-postgres:
